name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.configuration }} for iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Privacy manifest is valid
        run: plutil -lint ios/Courtly/PrivacyInfo.xcprivacy

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/Courtly.xcodeproj \
            -target Courtly \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -configuration ${{ matrix.configuration }} \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            | tee build.log | grep -E "^(\*\*|error:|warning:|.*: error:|.*: warning:|BUILD)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Privacy manifest is bundled
        run: test -f "build/${{ matrix.configuration }}-iphonesimulator/Courtly.app/PrivacyInfo.xcprivacy"

      - name: Show errors
        if: failure()
        run: grep -E "error:" build.log | head -100 || tail -100 build.log

  test:
    name: Unit tests on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Runner images carry several iOS runtimes and not every iPhone model exists on the newest one, so
      # the device is chosen by identifier: an iPhone on the highest iOS runtime available.
      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j | python3 -c 'import json, os, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(runtime): return tuple(int(n) for n in runtime.rsplit(".", 1)[-1].split("-")[1:])
          phones = [(version(r), d) for r, devices in runtimes.items() if ".iOS-" in r for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")]
          best = max(phones, key=lambda phone: (phone[0], phone[1]["name"]))[1]
          print("Testing on", best["name"], "udid", best["udid"])
          open(os.environ["GITHUB_OUTPUT"], "a").write("udid=" + best["udid"] + "\n")'

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Courtly.xcodeproj \
            -scheme Courtly \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "^(Test Suite|Test Case .* (passed|failed)|Executed|\*\*|error:|.*: error:)" || true
          grep -q "TEST SUCCEEDED" test.log
          grep -E "Executed [0-9]+ tests" test.log | tail -1

      - name: Show failures
        if: failure()
        run: grep -E "error:|failed" test.log | head -100 || tail -100 test.log

  config:
    name: Config check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # The app ships with the values in AppConfig.swift. Fail while any of them is still a placeholder,
      # and prove each Supabase key is accepted by its project.
      - name: Keys and URLs are real
        run: |
          set -e
          f=ios/Courtly/Config/AppConfig.swift
          if grep -q 'supabaseAnonKey = "eyJ' "$f"; then
            echo "::error::AppConfig.swift still holds legacy eyJ keys. Paste the sb_publishable_ keys from Project Settings → API Keys."; exit 1
          fi
          if grep -q 'https://courtly.app"' "$f"; then
            echo "::error::AppConfig.siteURL still points at the placeholder domain. Use the deployed Vercel URL."; exit 1
          fi
          mapfile -t urls < <(grep -o 'https://[a-z]*\.supabase\.co' "$f")
          mapfile -t keys < <(grep 'supabaseAnonKey = "' "$f" | grep -o 'sb_publishable_[A-Za-z0-9_-]*')
          [ "${#urls[@]}" -eq 2 ] && [ "${#keys[@]}" -eq 2 ] || { echo "::error::Expected two project URLs and two publishable keys in AppConfig.swift"; exit 1; }
          for i in 0 1; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: ${keys[$i]}" "${urls[$i]}/auth/v1/health")
            echo "${urls[$i]} → $status"
            [ "$status" = "200" ] || { echo "::error::${urls[$i]} rejected its key ($status)"; exit 1; }
          done
