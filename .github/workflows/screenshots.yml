name: README screenshots

# Run by hand. Signs in to the dev project as the App Review account on a simulator, walks the
# screens shown in the README and uploads one PNG per screen as the "readme-screenshots" artifact.
on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture on iOS Simulator
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same choice as the unit tests: an iPhone on the highest iOS runtime the runner image has.
      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j | python3 -c 'import json, os, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(runtime): return tuple(int(n) for n in runtime.rsplit(".", 1)[-1].split("-")[1:])
          phones = [(version(r), d) for r, devices in runtimes.items() if ".iOS-" in r for d in devices if d["isAvailable"] and d["name"].startswith("iPhone")]
          best = max(phones, key=lambda phone: (phone[0], phone[1]["name"]))[1]
          print("Capturing on", best["name"], "udid", best["udid"])
          open(os.environ["GITHUB_OUTPUT"], "a").write("udid=" + best["udid"] + "\n")'

      # Booted ahead of the test so the status bar can be set to the usual 9:41 with full signal and battery.
      - name: Boot the simulator with a clean status bar
        run: |
          udid="${{ steps.simulator.outputs.udid }}"
          sudo systemsetup -settimezone America/New_York   # the simulator keeps the host's zone; hits are in Florida
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3

      - name: Walk the app and save a PNG per screen
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
          TEST_RUNNER_REVIEWER_PASSWORD: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/Courtly.xcodeproj \
            -scheme CourtlyUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath screenshots.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "^(Test Suite|Test Case .* (passed|failed|skipped)|Executed|\*\*|error:|.*: error:)" || true
          grep -q "TEST SUCCEEDED" test.log
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: screenshots/*.png
          if-no-files-found: error

      # XCTest logs typed text ("Type '…' into TextField"), so the review code is in the log and the
      # result bundle. Artifacts of a public repo are downloadable, so the code is cut from the log
      # and the result bundle stays on the runner.
      - name: Remove the review code from the log
        if: failure()
        env:
          REVIEW_CODE: ${{ secrets.REVIEWER_PASSWORD }}
        run: |
          if [ -f test.log ] && [ -n "$REVIEW_CODE" ]; then
            LC_ALL=C sed -i '' "s/${REVIEW_CODE}/[review code]/g" test.log
            ! grep -q "$REVIEW_CODE" test.log
          fi

      - name: Keep the log and any screens captured when the walk fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-run-diagnostics
          path: |
            test.log
            screenshots
